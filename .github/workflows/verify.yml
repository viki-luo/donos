name: QEMU self-test and measurement

# 在 QEMU 中真正启动内核，并对串口输出做断言。
# Boot the kernel under QEMU and assert on its serial output.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-qemu
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, riscv64]

    steps:
      - name: 检出 / Checkout
        uses: actions/checkout@v4

      - name: 安装工具链 / Install toolchain
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make nasm qemu-system-x86 qemu-system-misc
          qemu-system-x86_64 --version
          qemu-system-riscv64 --version

      - name: 构建证据镜像 / Build the evidence image
        # SELFTEST=1 是关键：发布镜像不含任何自检与基准代码，
        # 对着它断言自检输出永远不会成立。
        run: make ARCH=${{ matrix.arch }} SELFTEST=1

      - name: 运行门禁并断言 / Run the same gate as local, then assert
        # tools/bench.sh 就是 `make check` 用的那个脚本：CI 与本地跑同一件事，
        # 否则「CI 绿」只是巧合。
        run: |
          set -eux
          SELFTEST=1 tools/bench.sh ${{ matrix.arch }}

          log=build/bench-${{ matrix.arch }}.log
          test -s "$log"
          tr -d "\r" < "$log" > serial.txt
          cat serial.txt

          # 1. 语义自检零失败
          grep -q "^  failures = 0$" serial.txt
          # 2. 基准压力测试零失败
          grep -q "bench failures = 0" serial.txt
          # 3. 每一项测量都必须出现
          for p in "base_apply accepted" "base_apply rejected" \
                   "object_resolve, chain of 1" "object_resolve, chain of 8" \
                   "full run over" "one 100 Hz tick period" \
                   "max run share of a tick" "capacity =" "churn cycles ="; do
            grep -q "$p" serial.txt
          done
          # 4. 尾延迟预算
          grep -q "^  latency p99.9" serial.txt
          # 5. 长期运行与中断风暴证据
          grep -q "^  endurance ticks = " serial.txt
          grep -q "^  storm ticks = " serial.txt
          # 6. 保护状态必须自报
          grep -q "protection: what the MMU actually enforces" serial.txt

      - name: 保存串口日志 / Save serial log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-${{ matrix.arch }}
          path: serial.txt
          if-no-files-found: warn
          retention-days: 7
