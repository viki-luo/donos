name: Build and verify

# 什么时候跑：任何推送到 main、任何 PR、可手动触发
# When it runs: every push to main, every pull request, or manually
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同一分支的新推送取消旧的运行，避免排队
  # A newer push to the same ref cancels the older run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, riscv64]

    steps:
      - name: 检出 / Checkout
        uses: actions/checkout@v4

      - name: 安装工具链 / Install toolchain
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make nasm \
            qemu-system-x86 qemu-system-misc
          clang --version
          ld.lld --version

      - name: 构建 / Build
        run: |
          set -eux
          make ARCH=${{ matrix.arch }}
          test -s build/${{ matrix.arch }}/liteos.bin
          llvm-size build/${{ matrix.arch }}/liteos.bin

      # 防回归门禁：裸机镜像里不允许出现「需要外部链接」的编译器运行时符号。
      # 注意不是常见的「变量除数」问题 —— 在 rv64imac（含 M 扩展）与
      # x86_64（有 divq）上变量除数都走硬件指令，不产生 libcall；真正的风险是
      # base/object.c 用到的 __int128 运算，以及将来可能加入的 128 位除法、
      # 软浮点等。这条检查只认事实：目标文件里还有没有 undefined 符号。
      # Regression gate: a bare-metal image must not carry compiler-runtime
      # symbols that need an external link. This is not the usual "variable
      # divisor" trap: with the M extension on rv64imac and divq on x86_64,
      # division is a hardware instruction and never emits a libcall. The real
      # risk is __int128 arithmetic used in base/object.c . So this
      # gate asserts the fact instead: no undefined symbols remain.
      #
      - name: 检查未定义运行时符号 / Check for undefined runtime symbols
        run: |
          set -eux
          image=build/${{ matrix.arch }}/liteos.bin
          if llvm-nm --undefined-only "$image" | grep -v '^-'; then
            echo "::error file=$image::undefined compiler-runtime symbol in a bare-metal image"
            exit 1
          fi
          echo "no undefined symbols: $image"
